services:
  # <service_name>: The identifier used to manage this service (e.g., myserver, master, re_2_0)
  master:
    # <tag>: The image tag you want to use (e.g., master, latest, 2.0.0)
    image: ghcr.io/iceflower/redeclipse-server:master
    # or if build it yourself, use the build section instead of image:
    build:
      # <dockerfile>: name of the dockerfile, usable for the chosen reference below
      dockerfile: Dockerfile_2_0_0
      args:
        # <reference>: can be any git reference (branch name, tag, SHA) (e.g. master, 2.0.0, ...)
        RE_REF: master
    ports:
      # <serverport>: Must match the port defined in Red Eclipse's servinit.cfg
      - "28801:28801/udp"
      # <serverport + 1>: The server port plus one (e.g., if serverport is 28801, use 28802)
      - "28802:28802/udp"
    restart: unless-stopped
    volumes:
      # <RE home dir>: Path to the RE home/config directory on your host system (e.g., /home/iceflower/re-master/home)
      - /home/iceflower/redeclipse-config/devel_home:/re-server-config/home:ro
      # <RE package dir>: Optional path to your local package directory for custom maps. Remove this section if not needed.
      - /home/iceflower/redeclipse-config/package:/re-server-config/package:ro
      # <sauerbraten dir>: Only required for legacy versions (< 2.0.0). Remove this block if using v2.0.0 or master.
      - /home/iceflower/redeclipse-config/sauerbraten:/re-server-config/sauer:ro
